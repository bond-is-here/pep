name: Pep checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Xcode and iOS SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Run Pep checks
        run: bash Tools/check.sh
      - name: Build for iPhone Simulator
        run: xcodebuild -project Pep.xcodeproj -scheme Pep -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build release for iPhone (unsigned)
        run: xcodebuild -project Pep.xcodeproj -scheme Pep -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
